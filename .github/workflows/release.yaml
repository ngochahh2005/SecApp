name: Android DevSecOps Pipeline

# Pipeline sẽ chạy khi đẩy code lên main, đẩy tag hoặc tạo PR
on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ==========================================
  # JOB 1: CODE QUALITY, SECURITY & TEST
  # ==========================================
  quality-and-test:
    name: Code Quality & Unit Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Cần thiết cho SonarCloud để lấy lịch sử git

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Kotlin Linter (Detekt)
        run: ./gradlew detekt

      - name: Run Unit Tests & JaCoCo Coverage
        run: ./gradlew testDebugUnitTest

      - name: SonarCloud Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        # Chạy Sonar phân tích code dựa trên kết quả test ở bước trên
        run: ./gradlew sonar --info

  # ==========================================
  # JOB 2: BUILD & DISTRIBUTE
  # ==========================================
  build-and-distribute:
    name: Build & Distribute to Firebase
    needs: quality-and-test # Chỉ chạy khi JOB 1 đã pass
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Calculate Version Name
        id: prep
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            # Lấy 7 ký tự đầu của commit SHA trên PR
            VERSION="${{ github.event.pull_request.head.sha }}"
            VERSION_SHORT="${VERSION:0:7}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            # Lấy tên của tag (ví dụ: v1.0.0)
            VERSION_SHORT="${{ github.ref_name }}"
          else
            # Mặc định trên main là latest
            VERSION_SHORT="latest"
          fi
          echo "version=${VERSION_SHORT}" >> $GITHUB_OUTPUT
          echo "Đã xác định Version của bản build là: ${VERSION_SHORT}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      # ---------------------------------------------------
      # BƯỚC KÝ (SIGN) APK (Rất quan trọng cho Mobile App)
      # ---------------------------------------------------
      - name: Sign APK
        uses: r0adkll/sign-android-release@f30bdd3351d322f281e285817c767406a666e4a2 # Pinned stable v1 (Audited Safe SHA)
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ steps.prep.outputs.version }}
          # Trỏ tới file đã được ký thành công
          path: ${{steps.sign_app.outputs.signedReleaseFile}}

      # ---------------------------------------------------
      # PHÂN PHỐI CHO TESTER QUA FIREBASE
      # ---------------------------------------------------
      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@a41b2f7324869c99e4f509930f7899017684177d # Pinned stable v1.7.0 (Audited Safe SHA)
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_CREDENTIALS }}
          groups: qateam, developers
          file: ${{steps.sign_app.outputs.signedReleaseFile}}
          releaseNotes: "Bản build tự động cho phiên bản: ${{ steps.prep.outputs.version }}"